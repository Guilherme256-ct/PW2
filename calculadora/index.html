<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Document</title>
</head>
<body>
    <form id="form1">
        
        <fieldset>
            <h1>Calculadora</h1>
        <label for="n1">Informe o 1° número </label>
        <input type="text" id="n1" value="0">
        <label for="n2">Informe o 2° número </label>
        <input type="text" id="n2" value="0">
        
        <div>
            <label for="opc">Operação: </label>
        <select name="opc" id="opc">
            <option value="mais">+</option>
            <option value="menos">-</option>
            <option value="divisao">/</option>
            <option value="multiplicacao">*</option>
        </select>
        <br>
        <br>

        <input type="button" value="Calcular" onclick='Calcula()'>
        <input type="reset" value="Resetar" onclick="document.getElementById('n1').focus()">
        </div>
        <label for="resutaldo">Resultado: </label>
        <input type="text" id="resultado" disabled>
        </fieldset>
    </form>


</body>
</html>
